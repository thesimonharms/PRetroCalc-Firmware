; PRetroCalc OS — Waveshare ESP32-S3-Pico in a ClockworkPi PicoCalc
;
; LCD SPI uses Pico GP10–12 → ESP32 GPIO35–37 (onboard Octal PSRAM lines).
; Keep Octal-PSRAM memory_type off (qio_qspi) so the ILI9488 keeps those pins.
;
; Flash: hold BOOT, plug USB-C, then:  pio run -t upload

[platformio]
src_dir = src
include_dir = include
default_envs = esp32s3-pico

[env:esp32s3-pico]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 16MB

; Do NOT add -I ../src — that pulls in Pico lwipopts.h and breaks Arduino lwIP.
build_flags =
  -O2
  -funsigned-char
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0
  -Wno-unused-parameter
  -Wno-missing-field-initializers

build_src_filter =
  +<*>

extra_scripts = pre:extra_script.py
